project_id = "techstage-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
enable_signup = true

[auth.external.google]
enabled = false
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_CLIENT_SECRET)"
redirect_uri = ""

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.catalog-api]
verify_jwt = false

[functions.user-api]
verify_jwt = true

[functions.manual-intake]
verify_jwt = false

[functions.admin-api]
verify_jwt = false

[functions.admin-asset-upload]
verify_jwt = false

[functions.job-runner]
verify_jwt = false

[functions.youtube-websub]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.billing]
verify_jwt = true

[functions.analyze-content]
verify_jwt = true

[functions.asset-workflow]
verify_jwt = false
